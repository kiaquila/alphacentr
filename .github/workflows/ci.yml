name: Project CI

# The repository's only workflow. Both jobs ask for nothing beyond reading the
# repository and run no code from outside the checked-out commit.
#
# This file is not a security boundary. A pull request is validated by its own
# branch's copy of this workflow, so a branch can change what is written here
# before the guard in it ever runs. What limits the exposure is repository
# configuration and review before merge — see docs/security.md, which records
# what actually holds and what does not.
#
# There is deliberately no `workflow_dispatch`: a manual run selects a ref, and
# the ref's copy of this file is what executes. The triggers below are either
# bound to the default branch or already validate the proposed commit.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  project-ci:
    name: project-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix site

      - name: Repository guard, harness tests, site check, payload budget
        run: npm run preflight

  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            .
