name: Project CI

# The repository's only workflow. Both jobs are read-only and run no code from
# outside the checked-out commit, so a proposed branch cannot escalate to a
# write token, publish a check, or read a secret.
#
# There is deliberately no `workflow_dispatch`. A manual run selects a ref and
# GitHub loads that ref's copy of this file, so a branch could replace the
# steps before the default branch's guard ever runs. The triggers below are
# either bound to the default branch or already validate the proposed commit.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  project-ci:
    name: project-ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Install locked dependencies
        run: |
          npm ci --ignore-scripts
          npm ci --ignore-scripts --prefix site

      - name: Repository guard, harness tests, site check, payload budget
        run: npm run preflight

  osv-scan:
    name: osv-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            .
